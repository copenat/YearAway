name: Update Adventures Category Counts

on:
  push:
    branches: [ develop ]
    paths:
      - 'and-now/content/adventures-data-public.yaml'
      - 'and-now/content/adventures-data-members.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'and-now/content/adventures-data-public.yaml'
      - 'and-now/content/adventures-data-members.yaml'

jobs:
  update-adventures-counts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Update adventures category counts
      run: |
        python3 update-adventures-category-counts.py
    
    - name: Debug Git Status
      run: |
        echo "Git status:"
        git status
        echo "Git remote:"
        git remote -v
        echo "Current branch:"
        git branch
    
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git add and-now/content/adventures-data-public.yaml and-now/content/adventures-data-members.yaml
        git commit -m "🤖 Auto-update adventure category counts
        
        - Updated category counts in adventures-data-public.yaml and adventures-data-members.yaml
        - Recalculated counts based on current adventures data
        - Keeps public and members sections separate
        - Generated by GitHub Actions workflow
        - Last updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        
        # Push to the same branch that triggered the workflow
        git push origin ${{ github.head_ref || github.ref_name }}
