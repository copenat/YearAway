name: Update Category Counts

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'and-now/content/tips-data.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'and-now/content/tips-data.json'

jobs:
  update-counts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Update category counts
      run: |
        python3 update-category-counts.py
    
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add and-now/content/category-counts.json
        git commit -m "🤖 Auto-update category counts from tips data
        
        - Updated category tip counts based on current tips-data.json
        - Generated by GitHub Actions workflow
        - Last updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        git push
