  - id: planning-a-trip-to-asia
    title: YearAway 2.5 Trip
    description: |
      We are currently planning a 6 month trip to Asia, specifically China, Thailand, Laos and finally India. We have been to all of them before but we are, as always, trying to find new places to visit.
      We have the outline flights and some accommodation booked especially around holidays or festivals. But otherwise we are going to book as we go, leaving us open to whimsical, flighty ways :)
      We've named this Yearaway 2.5 Trip as this is our second long trip and this one isnt a year but 6 months. Saying that, Yearaway 1.0 was supposed to have been one year but ended up being 18 months.
