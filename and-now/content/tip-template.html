<!-- Template for adding new tips -->
<!-- Copy this template and paste it into featured-tips.html -->

<!-- Public Tip Template -->
<div class="tip-card">
    <div class="tip-header">
        <div class="tip-category">[CATEGORY_ICON] [CATEGORY_NAME]</div>
        <div class="tip-rating">⭐⭐⭐⭐⭐</div>
    </div>
    <h3>[TIP_TITLE]</h3>
    <p>[TIP_DESCRIPTION]</p>
    <div class="tip-tags">
        <span class="tag">[TAG_1]</span>
        <span class="tag">[TAG_2]</span>
    </div>
</div>

<!-- Members-only Tip Template -->
<div class="tip-card members-only">
    <div class="member-indicator">🔒 Members Only</div>
    <div class="tip-header">
        <div class="tip-category">[CATEGORY_ICON] [CATEGORY_NAME]</div>
        <div class="tip-rating">⭐⭐⭐⭐⭐</div>
    </div>
    <h3>[TIP_TITLE]</h3>
    <p>[TIP_DESCRIPTION]</p>
    <div class="tip-tags">
        <span class="tag">[TAG_1]</span>
        <span class="tag">[TAG_2]</span>
    </div>
</div>
