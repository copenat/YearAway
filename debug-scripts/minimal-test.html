<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Test</title>
</head>
<body>
    <h1>Minimal Test</h1>
    <div id="output"></div>
    
    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += `<p>${message}</p>`;
            console.log(message);
        }
        
        // Test basic fetch
        async function testFetch() {
            try {
                log('Testing fetch...');
                
                const response = await fetch('https://develop.yearaway.pages.dev/and-now/content/category-counts.yaml');
                log(`Response status: ${response.status}`);
                
                if (response.ok) {
                    const text = await response.text();
                    log(`Text length: ${text.length}`);
                    log(`First 100 chars: ${text.substring(0, 100)}`);
                }
                
            } catch (error) {
                log(`Error: ${error.message}`);
            }
        }
        
        // Test TipsManager
        function testTipsManager() {
            log('Testing TipsManager...');
            
            if (window.tipsManager) {
                log('TipsManager exists');
            } else {
                log('TipsManager not found');
            }
        }
        
        // Run tests
        document.addEventListener('DOMContentLoaded', () => {
            log('DOM loaded');
            testFetch();
            
            setTimeout(testTipsManager, 2000);
        });
    </script>
    
    <!-- Load scripts -->
    <script src="https://develop.yearaway.pages.dev/and-now/js/simple-auth-system.js"></script>
    <script src="https://develop.yearaway.pages.dev/and-now/js/main.js"></script>
    <script src="https://develop.yearaway.pages.dev/and-now/js/tips-manager.js"></script>
</body>
</html>
